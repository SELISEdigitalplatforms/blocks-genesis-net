name: Run Tests
on: workflow_call
jobs:
  build:
    name: Test Execution
    runs-on: ubuntu-latest

    # The suite talks to real MongoDB, Redis and RabbitMQ on localhost default
    # ports (see docker-compose.yml). Without these the service-backed tests
    # fail with "Connection refused". No credentials: the tests use anonymous
    # mongodb://localhost:27017, redis on 6379 and RabbitMQ's default guest user.
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    permissions: 
      contents: read 
      checks: write 
      pull-requests: write  
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Environment Variables
        uses: ./.github/actions/setvars
        with:
          varFilePath: ./.github/variables/vars.env

      - name: Install coverlet.console
        run: dotnet tool install --global coverlet.console

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # The solution targets net10.0. 8.0.x/9.0.x stay installed only so the
      # global tools above (which target older runtimes) can run.
      - name: Initialize dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Find test projects
        id: find-projects
        run: |
          test_projects=$(find . -type f \( -name '*Test.csproj' -o -name '*Tests.csproj' -o -name 'Test*.csproj' \) -exec dirname {} \;)
          test_projects=${test_projects//$'\n'/ }
          test_projects=${test_projects//.\/src\//.\/}
          echo "projects=${test_projects}" >> "$GITHUB_OUTPUT"

      - name: Run Tests
        working-directory: ./src
        shell: bash
        env:
          SOLUTION: ${{ env.SOLUTION_NAME }}
          PROJECTS: ${{ steps.find-projects.outputs.projects }}
        run: |
          dotnet restore "./${SOLUTION}" -s https://api.nuget.org/v3/index.json -s https://nuget.selise.biz/nuget
          dotnet build "./${SOLUTION}" --no-incremental
          for project in $PROJECTS; do
            dotnet test "$project" --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx" /p:CollectCoverage=true /p:CoverletOutputFormat=opencover
          done

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: "**/*.trx"
          fail_on: test failures