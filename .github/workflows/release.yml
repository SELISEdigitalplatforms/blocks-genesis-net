name: Publish NuGet package

on:
  push:
    branches:
      - inception
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/Genesis/Blocks.Genesis.csproj

      - name: Build package project
        run: dotnet build src/Genesis/Blocks.Genesis.csproj --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack src/Genesis/Blocks.Genesis.csproj --configuration Release --no-build --output artifacts

      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: selise-devops

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
